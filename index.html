<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://ilozkxfqiqdyeejcddes.supabase.co" crossorigin>
<title>Unsere Projekte</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f8f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Projekte">
<link rel="icon" href="shared/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="shared/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f8f6;--surface:#fff;--ink:#18261f;--muted:#5f6f66;--line:#dde5df;--accent:#2f7a4a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--surface:#18201b;--ink:#e7efe9;--muted:#9aaba1;--line:#2a352f;--accent:#6cc28c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101613;--surface:#18201b;--ink:#e7efe9;--muted:#9aaba1;--line:#2a352f;--accent:#6cc28c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
h1{font-size:1.7rem;margin:0}
.who{color:var(--muted);font-size:.85rem;text-align:right}
.who button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
a.card{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none}
a.card img{width:48px;height:48px;border-radius:11px;flex:none}
a.card div{flex:1;min-width:0}
a.card b{display:block;font-size:1.05rem}
a.card span{color:var(--muted);font-size:.9rem}
a.card svg{color:var(--muted);flex:none}
</style>
</head>
<body>
<main id="apps" hidden>
  <div class="head"><h1>Unsere Projekte</h1><div class="who"><span id="who"></span><br><button type="button" id="out">Abmelden</button></div></div>
  <ul>
    <li><a class="card" href="einkaufsplaner/"><img src="einkaufsplaner/icons/icon-192.png" alt=""><div><b>Einkaufsplaner</b><span>Woche, Einkauf und Rezepte</span></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></li>
  </ul>
</main>
<script src="shared/vendor/supabase-js-2.117.3.js"></script>
<script src="shared/config.js"></script>
<script src="shared/backend.js" data-app="start"></script>
<script src="shared/version.js"></script>
<script src="shared/footer.js"></script>
<script>
/* Projekte erst nach der Anmeldung zeigen */
backend.named.then(n => document.getElementById("who").textContent = "Angemeldet: " + n);
backend.ready.then(() => {
  document.getElementById("out").onclick = () => backend.signOut();
  document.getElementById("apps").hidden = false;
});
</script>
</body>
</html>
